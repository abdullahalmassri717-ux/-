# Daily encrypted backup of the whole platform: the database (all tables and
# data) and the stored files (paper photos, payment receipts, logos). Runs every
# night, or by hand from the Actions tab ("Run workflow").
#
# Both files are encrypted with the database password (the SUPABASE_DB_PASSWORD
# secret), so they are useless without it. Every run also restores the database
# copy into an empty test database and compares row counts with the live one,
# and checks every stored file was copied, so a broken backup fails loudly.
# Kept 14 days as a workflow artifact ("platform-backup"), and ALSO copied to
# Cloudflare R2 (a separate company) once it is connected with
# set-backup-storage.yml: daily copies kept 30 days, the first copy of each
# month kept 12 months. How to restore: docs/backup.md.
name: Backup database

on:
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC = 2:30 / 3:30 AM in Palestine
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_REF: roeweplhofhjtcnbfmvo
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check the password secret
        run: |
          if [ -z "$PGPASSWORD" ]; then echo "::error::SUPABASE_DB_PASSWORD secret is missing."; exit 1; fi

      # GitHub machines have no IPv6, so connect through Supabase's connection
      # pooler (session mode, port 5432). Its address depends on the project's
      # region, so try the known regions until one accepts the project.
      - name: Find the database address
        run: |
          for region in eu-central-1 eu-central-2 eu-west-1 eu-west-2 eu-west-3 eu-north-1 us-east-1 us-east-2 us-west-1 us-west-2 \
                        ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 ca-central-1 sa-east-1 me-central-1; do
            for n in 0 1; do
              host="aws-$n-$region.pooler.supabase.com"
              if docker run --rm -e PGPASSWORD postgres:17 psql "host=$host port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require connect_timeout=8" -Atc 'select 1' >/dev/null 2>&1; then
                echo "DB_HOST=$host" >> "$GITHUB_ENV"
                echo "Found the database."
                exit 0
              fi
            done
          done
          echo "::error::Could not connect to the database (wrong password, or a new region)."
          exit 1

      - name: Dump the database
        run: |
          mkdir -p out
          # Row counts just before the copy, to check the restored copy against.
          q="select (select count(*) from public.organizations)||','||(select count(*) from public.students)||','||(select count(*) from public.submissions)||','||(select count(*) from public.question_grades)||','||(select count(*) from auth.users)||','||(select count(*) from storage.objects)"
          docker run --rm -e PGPASSWORD postgres:17 psql "host=$DB_HOST port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require" -Atc "$q" > out/live-counts.txt
          docker run --rm -e PGPASSWORD -v "$PWD/out:/out" postgres:17 \
            pg_dump "host=$DB_HOST port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require" \
              --format=custom --no-owner --no-privileges \
              --schema=public --schema=private --schema=auth --schema=storage \
              --file=/out/daqa.dump
          size=$(stat -c %s out/daqa.dump)
          if [ "$size" -lt 10000 ]; then echo "::error::Backup looks empty ($size bytes)."; exit 1; fi
          echo "Database dump: $(du -h out/daqa.dump | cut -f1)"

      - name: Copy the stored files
        run: |
          set -euo pipefail
          live() { docker run --rm -e PGPASSWORD postgres:17 psql "host=$DB_HOST port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require" -At -F $'\t' -c "$1"; }
          token=$(live "select value from private.app_secrets where name = 'weekly_reports_token'")
          echo "::add-mask::$token"
          url=$(live "select value from private.app_secrets where name = 'functions_url'")
          live "select bucket_id, name from storage.objects where bucket_id in ('submission-pages','payment-receipts','org-assets') and name not like '%/.emptyFolderPlaceholder' order by 1, 2" > out/objects.tsv
          expected=$(wc -l < out/objects.tsv)
          echo "Files to copy: $expected"
          mkdir -p files
          for bucket in submission-pages payment-receipts org-assets; do
            awk -F'\t' -v b="$bucket" '$1 == b { print $2 }' out/objects.tsv > /tmp/paths.txt
            split -l 200 -d /tmp/paths.txt /tmp/batch- || true
            for batch in /tmp/batch-*; do
              [ -s "$batch" ] || continue
              jq -Rn --arg b "$bucket" '{bucket: $b, paths: [inputs]}' < "$batch" > /tmp/req.json
              curl -fsS --retry 3 -X POST "$url/backup-files" -H 'Content-Type: application/json' \
                -H "x-daqa-cron: $token" --data @/tmp/req.json > /tmp/res.json
              jq -r '.urls[] | select(.url != null) | [.path, .url] | @tsv' /tmp/res.json | while IFS=$'\t' read -r path link; do
                mkdir -p "files/$bucket/$(dirname "$path")"
                case "$link" in http*) full="$link" ;; *) full="${url%/functions/v1}/storage/v1$link" ;; esac
                curl -fsS --retry 3 -o "files/$bucket/$path" "$full"
              done
              rm -f "$batch"
            done
          done
          copied=$(find files -type f | wc -l)
          echo "Files copied: $copied of $expected"
          if [ "$copied" -ne "$expected" ]; then echo "::error::Only $copied of $expected files were copied."; exit 1; fi
          tar -cf out/files.tar -C files . 
          echo "Files archive: $(du -h out/files.tar | cut -f1)"

      - name: Test the database copy (restore into an empty database)
        run: |
          set -euo pipefail
          docker run -d --name pgtest -e POSTGRES_PASSWORD=test -v "$PWD/out:/out" postgres:17 >/dev/null
          for i in $(seq 1 30); do docker exec pgtest pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          # Supabase's built-in roles, so the access rules can be restored too.
          docker exec pgtest psql -U postgres -q -c "create role anon nologin; create role authenticated nologin; create role service_role nologin; create role supabase_admin nologin; create role supabase_auth_admin nologin; create role supabase_storage_admin nologin; create role authenticator nologin; create schema if not exists extensions;" 
          docker exec pgtest pg_restore -U postgres -d postgres --no-owner --no-privileges /out/daqa.dump > restore.log 2>&1 || true
          echo "Restore warnings (Supabase-only parts that a plain database lacks): $(grep -c 'error:' restore.log || true)"
          q="select (select count(*) from public.organizations)||','||(select count(*) from public.students)||','||(select count(*) from public.submissions)||','||(select count(*) from public.question_grades)||','||(select count(*) from auth.users)||','||(select count(*) from storage.objects)"
          live=$(cat out/live-counts.txt)
          copy=$(docker exec pgtest psql -U postgres -Atc "$q")
          echo "Rows (organizations, students, papers, grades, users, files) live: $live  copy: $copy"
          if [ "$live" != "$copy" ]; then
            echo "::error::The restored copy does not match the live database."; grep 'error:' restore.log | head -20; exit 1
          fi
          docker rm -f pgtest >/dev/null

      - name: Encrypt
        run: |
          stamp=$(date -u +%Y-%m-%d)
          mkdir -p backup
          for f in daqa.dump files.tar; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$PGPASSWORD" \
                --symmetric --cipher-algo AES256 -o "backup/${f%%.*}-$stamp.${f#*.}.gpg" "out/$f"
          done
          rm -rf out files
          ls -lh backup

      - uses: actions/upload-artifact@v4
        with:
          name: platform-backup
          path: backup/
          retention-days: 14
          if-no-files-found: error

      # Second, independent copy on Cloudflare R2. Its settings live in
      # private.app_secrets (saved by set-backup-storage.yml). Until it is
      # connected this step only prints a notice.
      - name: Copy to Cloudflare R2
        run: |
          set -euo pipefail
          live() { docker run --rm -e PGPASSWORD postgres:17 psql "host=$DB_HOST port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require" -At -c "$1"; }
          conf=$(live "select coalesce(string_agg(name || '=' || value, E'\n'), '') from private.app_secrets where name like 'r2\_%'")
          get() { printf '%s\n' "$conf" | sed -n "s/^$1=//p"; }
          account=$(get r2_account_id); bucket=$(get r2_bucket); key_id=$(get r2_access_key_id); secret=$(get r2_secret_access_key)
          if [ -z "$account" ] || [ -z "$bucket" ] || [ -z "$key_id" ] || [ -z "$secret" ]; then
            echo "::notice::Cloudflare R2 is not connected yet (set-backup-storage.yml), so only the GitHub copy was kept."
            exit 0
          fi
          echo "::add-mask::$secret"
          export AWS_ACCESS_KEY_ID="$key_id" AWS_SECRET_ACCESS_KEY="$secret" AWS_DEFAULT_REGION=auto AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          end="https://$account.r2.cloudflarestorage.com"
          s3() { aws s3 --endpoint-url "$end" "$@"; }
          stamp=$(date -u +%Y-%m-%d); month=${stamp%-*}

          s3 cp backup/ "s3://$bucket/daily/$stamp/" --recursive --only-show-errors
          # Read the sizes back: a copy that is not complete fails the run.
          for f in backup/*; do
            want=$(stat -c %s "$f")
            got=$(aws s3api head-object --endpoint-url "$end" --bucket "$bucket" --key "daily/$stamp/$(basename "$f")" --query ContentLength --output text)
            [ "$want" = "$got" ] || { echo "::error::R2 copy of $(basename "$f") is $got bytes, expected $want."; exit 1; }
          done
          echo "Copied to R2: daily/$stamp/"

          # The first good copy of each month is also kept as the monthly copy.
          # (A month with fewer files than a full backup counts as missing.)
          have=$( (s3 ls "s3://$bucket/monthly/$month/" || true) | wc -l)
          if [ "$have" -lt "$(ls backup | wc -l)" ]; then
            s3 cp backup/ "s3://$bucket/monthly/$month/" --recursive --only-show-errors
            echo "Monthly copy kept: monthly/$month/"
          fi

          # Clean up: daily copies older than 30 days, monthly copies older than 12 months.
          old_day=$(date -u -d '30 days ago' +%Y-%m-%d); old_month=$(date -u -d '12 months ago' +%Y-%m)
          s3 ls "s3://$bucket/daily/" | awk '{print $2}' | tr -d / | while read -r d; do
            [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$d" < "$old_day" ]] && s3 rm "s3://$bucket/daily/$d/" --recursive --only-show-errors && echo "Removed old daily/$d" || true
          done
          s3 ls "s3://$bucket/monthly/" | awk '{print $2}' | tr -d / | while read -r m; do
            [[ "$m" =~ ^[0-9]{4}-[0-9]{2}$ ]] && [[ "$m" < "$old_month" ]] && s3 rm "s3://$bucket/monthly/$m/" --recursive --only-show-errors && echo "Removed old monthly/$m" || true
          done

          total=$(s3 ls "s3://$bucket/" --recursive --summarize | awk '/Total Size/ {print $3}')
          echo "R2 space used: $(numfmt --to=iec "${total:-0}") of the free 10 GB"
          if [ "${total:-0}" -gt 8000000000 ]; then echo "::warning::R2 backups use over 8 GB; the free limit is 10 GB."; fi
