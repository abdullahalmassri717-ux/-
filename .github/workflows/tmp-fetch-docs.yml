name: Temp fetch SMS docs
on:
  push:
    branches: [claude/project-thread-xkt2ah]
    paths: [.github/workflows/tmp-fetch-docs.yml]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in TzzGJE52 TzzGJE9N; do
            echo "===== $id"
            curl -sS "https://documenter.gw.postman.com/api/collections/1142337/$id?segregateAuth=true&versionTag=latest" > c.json
            jq -r '.info.name? // .name? // ""' c.json
            jq -c '.. | objects | select(has("request")) | {n:.name, m:.request.method, u:(.request.url|if type=="object" then .raw // ((.host|join("."))+"/"+(.path|join("/"))) else . end), b:[(.request.body.urlencoded // .request.body.formdata // [])[]? | (.key+"="+(.value|tostring|.[0:30]))], raw:(.request.body.raw // "" | .[0:300]), q:[(.request.url.query // [])[]? | (.key+"="+(.value|tostring|.[0:30]))], d:((.request.description // "")|gsub("<[^>]*>";"")|.[0:500]), r:[.response[]? | (.body // "" | .[0:200])]}' c.json | grep -iv "group\|contact\|template\|subuser\|archive\|excel\|card\|notification" 
          done
