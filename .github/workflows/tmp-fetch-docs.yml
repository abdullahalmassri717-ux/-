name: Temp fetch SMS docs
on:
  push:
    branches: [claude/project-thread-xkt2ah]
    paths: [.github/workflows/tmp-fetch-docs.yml]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in TzzGJE52 TzzGJE9N; do
            echo "===== $id"
            curl -sS "https://documenter.gw.postman.com/api/collections/1142337/$id?segregateAuth=true&versionTag=latest" > c.json
            jq -c '.. | objects | select(has("request")) | select((.name|test("send|sms|Send|SMS")) and (.name|test("template";"i")|not)) | {n:.name, m:.request.method, u:(.request.url|if type=="object" then .raw // ((.host|join("."))+"/"+(.path|join("/"))) else . end), b:[(.request.body.urlencoded // .request.body.formdata // [])[]? | (.key+"="+(.value|tostring|.[0:40])+" :: "+((.description//"")|tostring|gsub("<[^>]*>";"")))], raw:(.request.body.raw // ""), d:((.request.description // "")|gsub("<[^>]*>";"")), r:[.response[]? | (.body // "" | .[0:300])]}' c.json || true
          done
