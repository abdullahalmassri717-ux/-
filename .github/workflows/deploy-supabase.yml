# Applies the database migrations and deploys the server functions to the
# live Supabase project. Runs when supabase/ changes on main, or by hand from
# the Actions tab ("Run workflow").
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
#   ANTHROPIC_API_KEY      Claude key for grading and the AI tools (optional until AI is used;
#                          without it papers get made-up practice grades marked «تجريبي»)
# Optional: WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_REPORT_TEMPLATE, LINK_ATTEMPT_SALT
# Twilio (login codes + reports) is set by the "Set Twilio" workflow, not here.
# SMS (TweetSMS: login codes + report links) is set by the "Set SMS" workflow.
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:
    inputs:
      step:
        description: 'deploy (normal), or prepare/apply to run once with a new Supabase access token that is not in the secrets yet'
        required: false
        default: deploy
      prepare_run_id:
        description: 'apply only: the run id of the prepare run'
        required: false
      ciphertext:
        description: 'apply only: the access token encrypted with the prepare public key (base64, RSA-OAEP-SHA256)'
        required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: roeweplhofhjtcnbfmvo
      SECRET_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      # prepare: one-time key pair; the public half is printed, the private half
      # is kept in the Actions cache. Nothing is deployed in this run.
      - name: Make key pair (prepare only)
        if: inputs.step == 'prepare'
        run: |
          mkdir -p ~/tokkey && cd ~/tokkey
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out priv.pem 2>/dev/null
          openssl pkey -in priv.pem -pubout -out pub.pem
          echo "PUBLIC KEY (safe to share):"
          cat pub.pem

      - name: Keep private half (prepare only)
        if: inputs.step == 'prepare'
        uses: actions/cache/save@v4
        with:
          path: ~/tokkey/priv.pem
          key: token-keypair-${{ github.run_id }}

      - name: Restore private half (apply only)
        if: inputs.step == 'apply'
        uses: actions/cache/restore@v4
        with:
          path: ~/tokkey/priv.pem
          key: token-keypair-${{ inputs.prepare_run_id }}
          fail-on-cache-miss: true

      - name: Choose access token
        if: inputs.step != 'prepare'
        env:
          CIPHERTEXT: ${{ inputs.ciphertext }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.step }}" = apply ]; then
            tok=$(printf %s "$CIPHERTEXT" | base64 -d | openssl pkeyutl -decrypt -inkey ~/tokkey/priv.pem \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)
            rm -f ~/tokkey/priv.pem
          else
            tok="$SECRET_ACCESS_TOKEN"
          fi
          echo "::add-mask::$tok"
          echo "SUPABASE_ACCESS_TOKEN=$tok" >> "$GITHUB_ENV"

      - name: Delete private half from the cache
        if: always() && inputs.step == 'apply' && inputs.prepare_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "token-keypair-${{ inputs.prepare_run_id }}" --repo "$GITHUB_REPOSITORY" || true

      - uses: actions/checkout@v4
        if: inputs.step != 'prepare'

      # Installs the CLI with long retries: GitHub release downloads sometimes
      # answer 502/504 for several minutes, which made supabase/setup-cli fail.
      - name: Install Supabase CLI
        if: inputs.step != 'prepare'
        run: |
          url=https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o /tmp/supabase.tgz "$url"; then break; fi
            echo "Download failed (attempt $attempt), waiting before trying again..."
            sleep 30
          done
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Check required secrets
        if: inputs.step != 'prepare'
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the repository secrets."
            exit 1
          fi

      - name: Link project
        if: inputs.step != 'prepare'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Login-code protection: limits on how often codes can be requested and
      # tried. Only ever tightens a value, never loosens it. Prints no secrets.
      - name: Login code limits
        if: inputs.step != 'prepare'
        continue-on-error: true
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"
          curl -fsS "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/auth.json
          fields='{sms_otp_exp, sms_otp_length, sms_max_frequency, rate_limit_sms_sent, rate_limit_otp, rate_limit_verify, rate_limit_token_refresh}'
          echo "Before:"; jq "$fields" /tmp/auth.json
          jq '
            def atleast($k; $v): if (.[$k] // 0) < $v then {($k): $v} else {} end;
            def atmost($k; $v): if (.[$k] // ($v + 1)) > $v then {($k): $v} else {} end;
            atleast("sms_max_frequency"; 60) + atmost("sms_otp_exp"; 600)
              + atmost("rate_limit_verify"; 30) + atmost("rate_limit_otp"; 30)
              + atmost("rate_limit_sms_sent"; 60)
          ' /tmp/auth.json > /tmp/patch.json
          if [ "$(jq length /tmp/patch.json)" -gt 0 ]; then
            echo "Tightening:"; cat /tmp/patch.json
            curl -fsS -X PATCH "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'content-type: application/json' --data @/tmp/patch.json -o /dev/null
            echo "After:"; curl -fsS "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq "$fields"
          else
            echo "Already tight enough."
          fi
          rm -f /tmp/auth.json /tmp/patch.json

      - name: Apply database migrations
        if: inputs.step != 'prepare'
        # The CLI reads SUPABASE_DB_PASSWORD from the environment. Newer CLI
        # versions target the linked project with --remote, older ones with --linked.
        run: |
          if supabase db push --help 2>&1 | grep -q -- '--remote'; then
            supabase db push --remote --include-all --yes
          else
            supabase db push --linked --include-all
          fi

      - name: Set function secrets
        if: inputs.step != 'prepare'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_REPORT_TEMPLATE: ${{ secrets.WHATSAPP_REPORT_TEMPLATE }}
          LINK_ATTEMPT_SALT: ${{ secrets.LINK_ATTEMPT_SALT }}
        run: |
          args=()
          for name in ANTHROPIC_API_KEY WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_REPORT_TEMPLATE LINK_ATTEMPT_SALT; do
            if [ -n "${!name}" ]; then args+=("$name=${!name}"); fi
          done
          if [ ${#args[@]} -gt 0 ]; then
            yes_flag=""
            if supabase secrets set --help 2>&1 | grep -q -- '--yes'; then yes_flag="--yes"; fi
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" $yes_flag "${args[@]}"
          else
            echo "No function secrets set yet."
          fi

      - name: Deploy functions
        if: inputs.step != 'prepare'
        # Newer CLI versions ask for confirmation unless --yes is passed.
        run: |
          yes_flag=""
          if supabase functions deploy --help 2>&1 | grep -q -- '--yes'; then yes_flag="--yes"; fi
          supabase functions deploy grade-submission --project-ref "$SUPABASE_PROJECT_REF" $yes_flag
          supabase functions deploy ai-tools --project-ref "$SUPABASE_PROJECT_REF" $yes_flag
          supabase functions deploy send-reports --project-ref "$SUPABASE_PROJECT_REF" $yes_flag
          supabase functions deploy weekly-reports --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt $yes_flag
          supabase functions deploy grading-sweep --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt $yes_flag
          supabase functions deploy backup-files --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt $yes_flag
          supabase functions deploy student-submit --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt $yes_flag
          supabase functions deploy shared-report-papers --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt $yes_flag
          supabase functions deploy send-sms-hook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt $yes_flag
          supabase functions deploy whatsapp-inbound --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt $yes_flag
          supabase functions deploy push --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt $yes_flag
