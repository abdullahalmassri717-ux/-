# Applies the database migrations and deploys the server functions to the
# live Supabase project. Runs when supabase/ changes on main, or by hand from
# the Actions tab ("Run workflow").
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
#   ANTHROPIC_API_KEY      Claude key for grading and the AI tools (optional until AI is used;
#                          without it papers get made-up practice grades marked «تجريبي»)
# Optional: WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_REPORT_TEMPLATE, LINK_ATTEMPT_SALT
# Twilio (login codes + reports) is set by the "Set Twilio" workflow, not here.
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: roeweplhofhjtcnbfmvo
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Installs the CLI with long retries: GitHub release downloads sometimes
      # answer 502/504 for several minutes, which made supabase/setup-cli fail.
      - name: Install Supabase CLI
        run: |
          url=https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o /tmp/supabase.tgz "$url"; then break; fi
            echo "Download failed (attempt $attempt), waiting before trying again..."
            sleep 30
          done
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the repository secrets."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        # The CLI reads SUPABASE_DB_PASSWORD from the environment. Newer CLI
        # versions target the linked project with --remote, older ones with --linked.
        run: |
          if supabase db push --help 2>&1 | grep -q -- '--remote'; then
            supabase db push --remote --include-all --yes
          else
            supabase db push --linked --include-all
          fi

      - name: Set function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_REPORT_TEMPLATE: ${{ secrets.WHATSAPP_REPORT_TEMPLATE }}
          LINK_ATTEMPT_SALT: ${{ secrets.LINK_ATTEMPT_SALT }}
        run: |
          args=()
          for name in ANTHROPIC_API_KEY WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_REPORT_TEMPLATE LINK_ATTEMPT_SALT; do
            if [ -n "${!name}" ]; then args+=("$name=${!name}"); fi
          done
          if [ ${#args[@]} -gt 0 ]; then
            yes_flag=""
            if supabase secrets set --help 2>&1 | grep -q -- '--yes'; then yes_flag="--yes"; fi
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" $yes_flag "${args[@]}"
          else
            echo "No function secrets set yet."
          fi

      - name: Deploy functions
        # Newer CLI versions ask for confirmation unless --yes is passed.
        run: |
          yes_flag=""
          if supabase functions deploy --help 2>&1 | grep -q -- '--yes'; then yes_flag="--yes"; fi
          supabase functions deploy grade-submission --project-ref "$SUPABASE_PROJECT_REF" $yes_flag
          supabase functions deploy ai-tools --project-ref "$SUPABASE_PROJECT_REF" $yes_flag
          supabase functions deploy send-reports --project-ref "$SUPABASE_PROJECT_REF" $yes_flag
          supabase functions deploy weekly-reports --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt $yes_flag
          supabase functions deploy student-submit --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt $yes_flag
          supabase functions deploy send-sms-hook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt $yes_flag
