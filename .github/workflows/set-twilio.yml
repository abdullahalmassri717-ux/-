# Connects Twilio (WhatsApp login codes + weekly parent reports) to Supabase
# without the Twilio auth token ever appearing in the repository, the logs or a chat.
# Same two-run pattern as set-ai-key.yml:
#   1. step=prepare  makes a one-time key pair, keeps the private half in the
#                    Actions cache and prints the public half in the log.
#   2. step=apply    takes the auth token encrypted with that public half
#                    (base64, RSA-OAEP-SHA256), checks it with Twilio, then:
#                    - saves TWILIO_* function secrets (used by the report sender),
#                    - if verify_service_sid is given, switches Supabase phone
#                      login to Twilio Verify (WhatsApp codes),
#                    then deletes the private half.
#   step=status      prints the current (non-secret) phone login settings.
#   step=test        asks Supabase to send a real WhatsApp login code to test_phone
#                    (a Supabase test number gets no message).
# The account SID, Verify service SID, sender number and template SID are not
# secret, so they are plain inputs.
name: Set Twilio

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'prepare, apply, status or test'
        required: true
        default: prepare
      prepare_run_id:
        description: 'apply only: the run id of the prepare run'
        required: false
      ciphertext:
        description: 'apply only: the encrypted auth token, or "ACCOUNT_SID:AUTH_TOKEN" (base64)'
        required: false
      account_sid:
        description: 'apply only: Twilio Account SID (AC...), unless it is inside the ciphertext'
        required: false
      verify_service_sid:
        description: 'optional: Twilio Verify service SID (VA...) for login codes, or "create" to make one named Daqa'
        required: false
      whatsapp_from:
        description: 'optional: approved WhatsApp sender number, e.g. +970599000000'
        required: false
      test_phone:
        description: 'test only: phone number to send a real login code to, e.g. +970599000000'
        required: false
      report_content_sid:
        description: 'optional: approved weekly report Content template SID (HX...)'
        required: false
      ops:
        description: 'apply only, comma list: status, otp_template, report_template, hook (login codes on WhatsApp via Supabase Send SMS hook; needs otp_content_sid + whatsapp_from)'
        required: false
      otp_content_sid:
        description: 'hook only: approved WhatsApp authentication template SID (HX...)'
        required: false

permissions:
  contents: read
  actions: write

jobs:
  twilio:
    runs-on: ubuntu-latest
    env:
      REF: roeweplhofhjtcnbfmvo
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Make key pair
        if: inputs.step == 'prepare'
        run: |
          mkdir -p ~/twkey && cd ~/twkey
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out priv.pem 2>/dev/null
          openssl pkey -in priv.pem -pubout -out pub.pem
          echo "PUBLIC KEY (safe to share):"
          cat pub.pem

      - name: Keep private half
        if: inputs.step == 'prepare'
        uses: actions/cache/save@v4
        with:
          path: ~/twkey/priv.pem
          key: twilio-keypair-${{ github.run_id }}

      - name: Restore private half
        if: inputs.step == 'apply'
        uses: actions/cache/restore@v4
        with:
          path: ~/twkey/priv.pem
          key: twilio-keypair-${{ inputs.prepare_run_id }}
          fail-on-cache-miss: true

      - name: Decrypt, check and save
        if: inputs.step == 'apply'
        env:
          CIPHERTEXT: ${{ inputs.ciphertext }}
          SID: ${{ inputs.account_sid }}
          VA: ${{ inputs.verify_service_sid }}
          FROM: ${{ inputs.whatsapp_from }}
          HX: ${{ inputs.report_content_sid }}
          OPS: ${{ inputs.ops }}
          OTPHX: ${{ inputs.otp_content_sid }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; fi
          token=$(printf %s "$CIPHERTEXT" | base64 -d | openssl pkeyutl -decrypt -inkey ~/twkey/priv.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | tr -d '[:space:]')
          if [[ "$token" == *:* ]]; then SID="${token%%:*}"; token="${token#*:}"; fi
          echo "::add-mask::$token"
          [[ "$SID" =~ ^AC[0-9a-f]{32}$ ]] || { echo "::error::account_sid must look like AC + 32 hex characters"; exit 1; }
          rm -f ~/twkey/priv.pem

          code=$(curl -sS -o /tmp/acct.json -w '%{http_code}' -u "$SID:$token" \
            "https://api.twilio.com/2010-04-01/Accounts/$SID.json")
          echo "Twilio account check: HTTP $code"
          if [ "$code" != 200 ]; then jq -c '{code,message}' /tmp/acct.json || true; exit 1; fi
          jq -r '"Account: \(.friendly_name) | status: \(.status) | type: \(.type)"' /tmp/acct.json

          secrets=$(jq -n --arg sid "$SID" --arg tok "$token" \
            '[{name:"TWILIO_ACCOUNT_SID",value:$sid},{name:"TWILIO_AUTH_TOKEN",value:$tok}]')
          if [ -n "$FROM" ]; then secrets=$(jq --arg v "$FROM" '. + [{name:"TWILIO_WHATSAPP_FROM",value:$v}]' <<<"$secrets"); fi
          if [ -n "$HX" ]; then
            hcode=$(curl -sS -o /tmp/hx.json -w '%{http_code}' -u "$SID:$token" "https://content.twilio.com/v1/Content/$HX")
            echo "Report template check: HTTP $hcode"
            if [ "$hcode" != 200 ]; then jq -c '{code,message}' /tmp/hx.json || true; exit 1; fi
            curl -sS -u "$SID:$token" "https://content.twilio.com/v1/Content/$HX/ApprovalRequests" \
              | jq -c '{whatsapp_status: .whatsapp.status, rejection: .whatsapp.rejection_reason}' || true
            secrets=$(jq --arg v "$HX" '. + [{name:"TWILIO_REPORT_CONTENT_SID",value:$v}]' <<<"$secrets")
          fi
          printf %s "$secrets" > /tmp/body.json
          curl -fsS --retry 3 --retry-all-errors -X POST "https://api.supabase.com/v1/projects/$REF/secrets" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' \
            --data @/tmp/body.json
          rm -f /tmp/body.json
          echo "Function secrets saved: $(jq -r '[.[].name] | join(", ")' <<<"$secrets")"

          if [ "$VA" = create ]; then
            VA=$(curl -sS -u "$SID:$token" https://verify.twilio.com/v2/Services | jq -r '.services[] | select(.friendly_name=="Daqa") | .sid' | head -1)
            if [ -z "$VA" ]; then
              VA=$(curl -fsS -u "$SID:$token" -X POST https://verify.twilio.com/v2/Services \
                --data-urlencode FriendlyName=Daqa --data-urlencode CodeLength=6 | jq -r .sid)
              echo "Created Verify service $VA"
            else
              echo "Using existing Verify service $VA"
            fi
          fi
          if [ -n "$VA" ]; then
            vcode=$(curl -sS -o /tmp/va.json -w '%{http_code}' -u "$SID:$token" "https://verify.twilio.com/v2/Services/$VA")
            echo "Verify service check: HTTP $vcode"
            if [ "$vcode" != 200 ]; then jq -c '{code,message}' /tmp/va.json || true; exit 1; fi
            jq -r '"Verify service: \(.friendly_name) | code length: \(.code_length)"' /tmp/va.json
            jq -n --arg sid "$SID" --arg tok "$token" --arg va "$VA" '{
                external_phone_enabled: true,
                sms_provider: "twilio_verify",
                sms_twilio_verify_account_sid: $sid,
                sms_twilio_verify_auth_token: $tok,
                sms_twilio_verify_message_service_sid: $va
              }' > /tmp/auth.json
            curl -fsS --retry 3 --retry-all-errors -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' \
              --data @/tmp/auth.json -o /dev/null
            rm -f /tmp/auth.json
            echo "Supabase phone login now uses Twilio Verify."
          fi

          tw() { curl -sS -u "$SID:$token" "$@"; }
          if [[ ",$OPS," == *",status,"* ]]; then
            echo "== WhatsApp senders =="
            tw "https://messaging.twilio.com/v2/Channels/Senders?Channel=whatsapp&PageSize=20" \
              | jq -c '.senders[]? | {sid, sender_id, status, display_name: .profile.name, offline_reasons}' || true
            echo "== Verify services =="
            tw "https://verify.twilio.com/v2/Services" | jq -c '.services[]? | {sid, friendly_name, whatsapp}' || true
            echo "== Last verification attempts =="
            tw "https://verify.twilio.com/v2/Attempts?PageSize=5" \
              | jq -c '.attempts[]? | {date_created, channel, conversion_status, price, to: (.channel_data.to // "" | .[0:6])}' || true
            echo "== Content templates =="
            tw "https://content.twilio.com/v1/ContentAndApprovals?PageSize=20" \
              | jq -c '.contents[]? | {sid, friendly_name, language, approval: .approval_requests}' || true
          fi
          if [[ ",$OPS," == *",otp_template,"* ]]; then
            jq -n '{friendly_name:"daqa_login_code", language:"ar", variables:{"1":"123456"},
                types:{"whatsapp/authentication":{add_security_recommendation:true, code_expiration_minutes:10,
                  actions:[{type:"COPY_CODE", copy_code_text:"نسخ الرمز"}]}}}' > /tmp/otp.json
            otphx=$(tw -X POST https://content.twilio.com/v1/Content -H 'content-type: application/json' --data @/tmp/otp.json | tee /tmp/otp_out.json | jq -r '.sid // empty')
            if [ -z "$otphx" ]; then cat /tmp/otp_out.json; exit 1; fi
            echo "Login code template: $otphx"
            tw -X POST "https://content.twilio.com/v1/Content/$otphx/ApprovalRequests/whatsapp" -H 'content-type: application/json' \
              -d '{"name":"daqa_login_code","category":"AUTHENTICATION"}' | jq -c '{name, category, status, rejection_reason, code, message}'
          fi
          if [[ ",$OPS," == *",hook,"* ]]; then
            [ -n "$OTPHX" ] && [ -n "$FROM" ] || { echo "::error::hook needs otp_content_sid and whatsapp_from"; exit 1; }
            tw "https://content.twilio.com/v1/Content/$OTPHX/ApprovalRequests" | jq -c '{whatsapp_status: .whatsapp.status, rejection: .whatsapp.rejection_reason}'
            hook="v1,whsec_$(openssl rand -base64 32 | tr -d '\n')"
            echo "::add-mask::$hook"
            jq -n --arg h "$hook" --arg o "$OTPHX" '[{name:"SEND_SMS_HOOK_SECRET",value:$h},{name:"TWILIO_OTP_CONTENT_SID",value:$o}]' > /tmp/hs.json
            curl -fsS --retry 3 --retry-all-errors -X POST "https://api.supabase.com/v1/projects/$REF/secrets" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' --data @/tmp/hs.json
            jq -n --arg h "$hook" --arg u "https://$REF.supabase.co/functions/v1/send-sms-hook" \
              '{hook_send_sms_enabled:true, hook_send_sms_uri:$u, hook_send_sms_secrets:$h, sms_otp_exp:600}' > /tmp/hk.json
            curl -fsS --retry 3 --retry-all-errors -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' --data @/tmp/hk.json -o /dev/null
            rm -f /tmp/hs.json /tmp/hk.json
            echo "Login codes now go through the send-sms-hook function (WhatsApp only)."
          fi
          if [[ ",$OPS," == *",report_template,"* ]]; then
            body=$(printf '%s\n\n%s\n\n%s' 'السلام عليكم، هذا التقرير الأسبوعي من منصة دقة:' '{{1}}' 'مع تحيات فريق دقة.')
            jq -n --arg b "$body" '{friendly_name:"daqa_weekly_report", language:"ar",
                variables:{"1":"الرياضيات: 18/20"}, types:{"twilio/text":{body:$b}}}' > /tmp/content.json
            hx=$(tw -X POST https://content.twilio.com/v1/Content -H 'content-type: application/json' --data @/tmp/content.json | tee /tmp/content_out.json | jq -r '.sid // empty')
            if [ -z "$hx" ]; then cat /tmp/content_out.json; exit 1; fi
            echo "Report template: $hx"
            tw -X POST "https://content.twilio.com/v1/Content/$hx/ApprovalRequests/whatsapp" -H 'content-type: application/json' \
              -d '{"name":"daqa_weekly_report","category":"UTILITY"}' | jq -c '{name, category, status, rejection_reason, code, message}'
          fi

      - name: Show phone login settings
        if: inputs.step == 'apply' || inputs.step == 'status'
        run: |
          curl -fsS "https://api.supabase.com/v1/projects/$REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq '{external_phone_enabled, sms_provider, sms_otp_length, sms_otp_exp, hook_send_sms_enabled, hook_send_sms_uri,
                   verify_service: .sms_twilio_verify_message_service_sid,
                   test_numbers: ((.sms_test_otp // "") | split(",") | length)}'
          curl -fsS "https://api.supabase.com/v1/projects/$REF/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '[.[].name | select(startswith("TWILIO") or startswith("WHATSAPP"))] | "WhatsApp secrets: \(join(", "))"'

      - name: Send a test login code
        if: inputs.step == 'test'
        env:
          PHONE: ${{ inputs.test_phone }}
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$REF"
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json')
          anon=$(curl -fsS "$api/api-keys" "${auth[@]}" | jq -r '[.[] | select(.name=="anon")][0].api_key')
          echo "::add-mask::$anon"
          # A Supabase test number never gets a real message, so take it out of
          # the test list for this one send and always put the list back after.
          curl -fsS "$api/config/auth" "${auth[@]}" > /tmp/cfg.json
          orig=$(jq -r '.sms_test_otp // ""' /tmp/cfg.json)
          until=$(jq -r '.sms_test_otp_valid_until // ""' /tmp/cfg.json)
          echo "Test numbers valid until: ${until:-not set}"
          patch_list() {
            jq -n --arg v "$1" --arg u "$until" '{sms_test_otp: $v} + (if $u == "" then {} else {sms_test_otp_valid_until: $u} end)' \
              | curl -sS -X PATCH "$api/config/auth" "${auth[@]}" --data @- -o /tmp/patch.json -w '%{http_code}'
          }
          digits="${PHONE//[^0-9]/}"
          trimmed=$(printf %s "$orig" | tr ',' '\n' | grep -v "^${digits}=" | paste -sd, - || true)
          restore() {
            c=$(patch_list "$orig"); echo "Restore test number list: HTTP $c"; [ "$c" = 200 ] || cat /tmp/patch.json
          }
          if [ "$trimmed" != "$orig" ]; then
            echo "$PHONE is a test number: taking it out of the list for this send."
            trap restore EXIT
            c=$(patch_list "$trimmed"); echo "Remove from test list: HTTP $c"
            if [ "$c" != 200 ]; then cat /tmp/patch.json; trap - EXIT; exit 1; fi
            sleep 5
          fi
          code=$(curl -sS -o /tmp/otp.json -w '%{http_code}' "https://$REF.supabase.co/auth/v1/otp" \
            -H "apikey: $anon" -H 'content-type: application/json' \
            -d "$(jq -n --arg p "$PHONE" '{phone:$p, channel:"whatsapp"}')")
          echo "Supabase send code: HTTP $code"
          cat /tmp/otp.json; echo

      - name: Delete private half from the cache
        if: always() && inputs.step == 'apply' && inputs.prepare_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "twilio-keypair-${{ inputs.prepare_run_id }}" --repo "$GITHUB_REPOSITORY" || true
