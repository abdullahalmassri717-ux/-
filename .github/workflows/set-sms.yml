# Connects the SMS provider TweetSMS (Tweet tec Company, Gaza) to Supabase:
# login codes and short weekly-report messages with a link.
# The API key never appears in the repository, the logs or a chat.
# Same two-run pattern as set-ai-key.yml:
#   1. step=prepare  makes a one-time key pair, keeps the private half in the
#                    Actions cache and prints the public half in the log.
#   2. step=apply    takes the encrypted secrets (base64, RSA-OAEP-SHA256) and runs `ops`.
#                    The plaintext is "TWEETSMS_API_KEY", or "SUPABASE_ACCESS_TOKEN|TWEETSMS_API_KEY"
#                    when the repository's Supabase token is expired.
#                    Each apply needs a fresh prepare.
# ops (comma list, in this order):
#   check           balance, sender names and the sender's status (nothing changes)
#   request_sender  asks the provider to approve `sender` as a new sender name
#   save            saves TWEETSMS_API_KEY and TWEETSMS_SENDER as Supabase function secrets
#   test            sends one real SMS to test_phone
#   login_on        login screens say the code comes by SMS (platform_settings.login_sms)
#   login_off       back to the WhatsApp wording
#   remove          deletes the SMS secrets from Supabase (stops all SMS)
# API docs: https://documenter.getpostman.com/view/1142337/TzzGJE52
name: Set SMS

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'prepare or apply'
        required: true
        default: prepare
      prepare_run_id:
        description: 'apply only: the run id of the prepare run'
        required: false
      ciphertext:
        description: 'apply only: encrypted "API_KEY" or "SUPABASE_TOKEN|API_KEY" (base64)'
        required: false
      ops:
        description: 'apply only, comma list: check, request_sender, save, test, login_on, login_off, remove'
        required: false
        default: check
      sender:
        description: 'sender name approved by the provider, e.g. Dequa (2-11 English letters/digits)'
        required: false
      test_phone:
        description: 'test only: phone number for one real SMS, e.g. 0599123456'
        required: false

permissions:
  contents: read
  actions: write

jobs:
  sms:
    runs-on: ubuntu-latest
    env:
      REF: roeweplhofhjtcnbfmvo
      API: https://www.tweetsms.ps/api.php/office
    steps:
      - name: Make key pair
        if: inputs.step == 'prepare'
        run: |
          mkdir -p ~/smskey && cd ~/smskey
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out priv.pem 2>/dev/null
          openssl pkey -in priv.pem -pubout -out pub.pem
          echo "PUBLIC KEY (safe to share):"
          cat pub.pem

      - name: Keep private half
        if: inputs.step == 'prepare'
        uses: actions/cache/save@v4
        with:
          path: ~/smskey/priv.pem
          key: sms-keypair-${{ github.run_id }}

      - name: Restore private half
        if: inputs.step == 'apply'
        uses: actions/cache/restore@v4
        with:
          path: ~/smskey/priv.pem
          key: sms-keypair-${{ inputs.prepare_run_id }}
          fail-on-cache-miss: true

      - name: Run
        if: inputs.step == 'apply'
        env:
          CIPHERTEXT: ${{ inputs.ciphertext }}
          REPO_SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPS: ${{ inputs.ops }}
          SENDER: ${{ inputs.sender }}
          TEST_PHONE: ${{ inputs.test_phone }}
        run: |
          set -euo pipefail
          plain=$(printf %s "$CIPHERTEXT" | base64 -d | openssl pkeyutl -decrypt -inkey ~/smskey/priv.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)
          rm -f ~/smskey/priv.pem
          if [[ "$plain" == *"|"* ]]; then tok="${plain%%|*}"; key="${plain#*|}"; else tok="$REPO_SUPABASE_TOKEN"; key="$plain"; fi
          key="$(printf %s "$key" | tr -d '[:space:]')"
          echo "::add-mask::$key"; [ -n "$tok" ] && echo "::add-mask::$tok"
          [ -n "$key" ] || { echo "::error::No API key in the ciphertext"; exit 1; }

          call() { # call <endpoint> <json extra fields>
            jq -n --arg k "$key" --argjson x "${2:-{\}}" '{api_key:$k} + $x' > /tmp/req.json
            curl -sS --retry 2 -X POST "$API/$1" -H 'content-type: application/json' --data-binary @/tmp/req.json
            rm -f /tmp/req.json; echo
          }
          sql() {
            jq -n --arg q "$1" '{query:$q}' > /tmp/q.json
            code=$(curl -sS -o /tmp/q_out.json -w '%{http_code}' --retry 3 --retry-all-errors -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $tok" -H 'content-type: application/json' --data-binary @/tmp/q.json)
            echo "SQL: HTTP $code"; case "$code" in 2*) ;; *) cat /tmp/q_out.json; exit 1 ;; esac
          }
          has() { [[ ",${OPS// /}," == *",$1,"* ]]; }

          if has check; then
            echo "== Login check";  call chk_user | sed "s/$key/***/g"
            echo "== Balance";      call chk_balance
            echo "== Senders";      call usersender
            if [ -n "$SENDER" ]; then echo "== Sender status ($SENDER)"; call senderstatus "$(jq -n --arg s "$SENDER" '{sendertext:$s}')"; fi
          fi
          if has request_sender; then
            [ -n "$SENDER" ] || { echo "::error::request_sender needs sender"; exit 1; }
            echo "== Request sender $SENDER"; call newsender "$(jq -n --arg s "$SENDER" '{sendertext:$s}')"
          fi
          if has save; then
            [ -n "$SENDER" ] || { echo "::error::save needs sender"; exit 1; }
            [ -n "$tok" ] || { echo "::error::No Supabase access token"; exit 1; }
            jq -n --arg k "$key" --arg s "$SENDER" '[{name:"TWEETSMS_API_KEY",value:$k},{name:"TWEETSMS_SENDER",value:$s}]' > /tmp/body.json
            curl -fsS --retry 3 --retry-all-errors -X POST "https://api.supabase.com/v1/projects/$REF/secrets" \
              -H "Authorization: Bearer $tok" -H 'content-type: application/json' --data @/tmp/body.json
            rm -f /tmp/body.json
            curl -fsS "https://api.supabase.com/v1/projects/$REF/secrets" -H "Authorization: Bearer $tok" \
              | jq -r '.[].name' | grep -E '^TWEETSMS_' | sed 's/^/saved in Supabase: /'
          fi
          if has test; then
            [ -n "$TEST_PHONE" ] && [ -n "$SENDER" ] || { echo "::error::test needs test_phone and sender"; exit 1; }
            num=$(printf %s "$TEST_PHONE" | tr -cd '0-9' | sed -E 's/^(00)?97[02](5[0-9]{8})$/0\2/; s/^(5[0-9]{8})$/0\1/')
            echo "== Test SMS to ${num:0:4}******"
            call sendsms "$(jq -n --arg s "$SENDER" --arg t "$num" '{sender:$s, to:$t, message:"رسالة تجربة من منصة دقة. الرسائل النصية تعمل ✓"}')"
          fi
          if has login_on; then
            sql "insert into public.platform_settings (key, value, is_public) values ('login_sms', '{\"enabled\": true}'::jsonb, true) on conflict (key) do update set value = excluded.value, is_public = true;"
            echo "Login screens now say: code by SMS."
          fi
          if has login_off; then
            sql "delete from public.platform_settings where key = 'login_sms';"
            echo "Login screens back to WhatsApp wording."
          fi
          if has remove; then
            curl -fsS -X DELETE "https://api.supabase.com/v1/projects/$REF/secrets" -H "Authorization: Bearer $tok" \
              -H 'content-type: application/json' -d '["TWEETSMS_API_KEY","TWEETSMS_SENDER"]' && echo "SMS secrets removed."
          fi

      - name: Delete private half from the cache
        if: always() && inputs.step == 'apply' && inputs.prepare_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "sms-keypair-${{ inputs.prepare_run_id }}" --repo "$GITHUB_REPOSITORY" || true
