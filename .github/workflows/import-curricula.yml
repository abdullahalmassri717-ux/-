# Loads curricula/palestine/import.sql into the live database (adds only what is
# missing, never deletes). Runs when that file changes, or by hand.
# Uses the SUPABASE_ACCESS_TOKEN repository secret (Supabase Management API).
name: Import curricula

on:
  push:
    paths: ['curricula/palestine/import.sql', '.github/workflows/import-curricula.yml']
  workflow_dispatch:

concurrency:
  group: import-curricula
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: roeweplhofhjtcnbfmvo
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run import
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; fi
          jq -Rs '{query: .}' curricula/palestine/import.sql > /tmp/body.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --retry 3 --retry-all-errors \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/body.json)
          echo "HTTP $code"; cat /tmp/out.json; echo
          case "$code" in 2*) ;; *) exit 1 ;; esac
