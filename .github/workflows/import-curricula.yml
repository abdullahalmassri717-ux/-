# Loads curricula/palestine/import.sql into the live database (adds only what is
# missing, never deletes). Runs when that file changes, or by hand.
# Uses the SUPABASE_ACCESS_TOKEN repository secret (Supabase Management API).
# When that secret is out of date, run it by hand twice: step=prepare (prints a
# public key), then step=apply with prepare_run_id and the new access token
# encrypted with that key (base64, RSA-OAEP-SHA256), same as "Deploy Supabase".
name: Import curricula

on:
  push:
    paths: ['curricula/palestine/import.sql', 'curricula/palestine/import-content/**', '.github/workflows/import-curricula.yml']
  workflow_dispatch:
    inputs:
      step:
        description: 'import (normal), or prepare/apply to run once with a new Supabase access token that is not in the secrets yet'
        required: false
        default: import
      prepare_run_id:
        description: 'apply only: the run id of the prepare run'
        required: false
      ciphertext:
        description: 'apply only: the access token encrypted with the prepare public key (base64, RSA-OAEP-SHA256)'
        required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: import-curricula
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: roeweplhofhjtcnbfmvo
      SECRET_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Make key pair (prepare only)
        if: inputs.step == 'prepare'
        run: |
          mkdir -p ~/tokkey && cd ~/tokkey
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out priv.pem 2>/dev/null
          openssl pkey -in priv.pem -pubout -out pub.pem
          echo "PUBLIC KEY (safe to share):"
          cat pub.pem

      - name: Keep private half (prepare only)
        if: inputs.step == 'prepare'
        uses: actions/cache/save@v4
        with:
          path: ~/tokkey/priv.pem
          key: curricula-keypair-${{ github.run_id }}

      - name: Restore private half (apply only)
        if: inputs.step == 'apply'
        uses: actions/cache/restore@v4
        with:
          path: ~/tokkey/priv.pem
          key: curricula-keypair-${{ inputs.prepare_run_id }}
          fail-on-cache-miss: true

      - name: Choose access token
        if: inputs.step != 'prepare'
        env:
          CIPHERTEXT: ${{ inputs.ciphertext }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.step }}" = apply ]; then
            tok=$(printf %s "$CIPHERTEXT" | base64 -d | openssl pkeyutl -decrypt -inkey ~/tokkey/priv.pem \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)
            rm -f ~/tokkey/priv.pem
          else
            tok="$SECRET_ACCESS_TOKEN"
          fi
          echo "::add-mask::$tok"
          echo "SUPABASE_ACCESS_TOKEN=$tok" >> "$GITHUB_ENV"

      - name: Delete private half from the cache
        if: always() && inputs.step == 'apply' && inputs.prepare_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "curricula-keypair-${{ inputs.prepare_run_id }}" --repo "$GITHUB_REPOSITORY" || true

      - uses: actions/checkout@v4
        if: inputs.step != 'prepare'

      - name: Run import
        if: inputs.step != 'prepare'
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; fi
          # Structure first, then the lesson text in parts (each part only fills empty lessons).
          for f in curricula/palestine/import.sql curricula/palestine/import-content/*.sql; do
            echo "== $f"
            jq -Rs '{query: .}' "$f" > /tmp/body.json
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --retry 3 --retry-all-errors --max-time 300 \
              -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/body.json)
            echo "HTTP $code"; head -c 2000 /tmp/out.json; echo
            case "$code" in 2*) ;; *) exit 1 ;; esac
          done
