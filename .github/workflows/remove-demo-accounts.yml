# Removes all demo data from the live site before real use: the 4 demo
# organizations (with their classes, students, exams and papers), the 5 demo
# users, and their numbers from Supabase "test phone numbers" (other numbers in
# that list, such as the owner's own, are kept).
# Runs ONLY by hand from the Actions tab, after typing DELETE. It cannot be undone,
# but the demo accounts can be created again with the "Demo accounts" workflow.
name: Remove demo accounts

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove all demo accounts and their data'
        required: true
        default: ''

concurrency:
  group: demo-accounts
  cancel-in-progress: false

jobs:
  remove:
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    env:
      REF: roeweplhofhjtcnbfmvo
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEMO_PHONES: '970599990001 970599990002 970599990003 970599990004 970599990005'
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; fi

      - name: Delete demo organizations and users
        run: |
          jq -Rs '{query: .}' scripts/demo-remove/remove-demo-accounts.sql > /tmp/body.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --retry 3 --retry-all-errors --max-time 300 \
            -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/body.json)
          echo "HTTP $code"; head -c 2000 /tmp/out.json; echo
          case "$code" in 2*) ;; *) exit 1 ;; esac

      - name: Remove demo numbers from the test phone list
        run: |
          api="https://api.supabase.com/v1/projects/$REF/config/auth"
          curl -fsS --retry 3 --retry-all-errors "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/auth.json
          current=$(jq -r '.sms_test_otp // ""' /tmp/auth.json)
          kept=""
          IFS=',' read -ra entries <<< "$current"
          for e in "${entries[@]}"; do
            num="${e%%=*}"
            case " $DEMO_PHONES " in *" $num "*) ;; *) [ -n "$e" ] && kept="${kept:+$kept,}$e" ;; esac
          done
          jq -n --arg otp "$kept" '{sms_test_otp: $otp}' > /tmp/patch.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --retry 3 --retry-all-errors -X PATCH "$api" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/patch.json)
          echo "HTTP $code"
          case "$code" in 2*) ;; *) head -c 500 /tmp/out.json; exit 1 ;; esac
          echo "Test numbers left: $(echo "$kept" | tr ',' '\n' | grep -c = || true)"
