# Removes all demo data from the live site before real use: the 4 demo
# organizations (with their classes, students, exams and papers), the 5 demo
# users, and their numbers from Supabase "test phone numbers" (other numbers in
# that list, such as the owner's own, are kept).
# Runs ONLY by hand from the Actions tab: LIST (read only), DRYRUN (undone), DELETE.
# but the demo accounts can be created again with the "Demo accounts" workflow.
name: Remove demo accounts

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'LIST = only print what exists; DRYRUN = run the cleanup and undo it; DELETE = remove the test data for real; SHOWCASE = give the platform owner his own demo school + tutor page'
        required: true
        default: 'LIST'
      extra_user_ids:
        description: 'Optional: extra user ids to delete, comma separated'
        required: false
        default: ''

concurrency:
  group: demo-accounts
  cancel-in-progress: false

jobs:
  # Read-only inventory with the database password: what exists per organization,
  # the users, and the files. Prints only org names, counts and the last 3 digits
  # of phone numbers (this repository is public).
  list:
    if: ${{ github.event.inputs.confirm == 'LIST' }}
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: roeweplhofhjtcnbfmvo
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the database address
        run: |
          for region in eu-central-1 eu-central-2 eu-west-1 eu-west-2 eu-west-3 eu-north-1 us-east-1 us-east-2 us-west-1 us-west-2 \
                        ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 ca-central-1 sa-east-1 me-central-1; do
            for n in 0 1; do
              host="aws-$n-$region.pooler.supabase.com"
              if docker run --rm -e PGPASSWORD postgres:17 psql "host=$host port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require connect_timeout=8" -Atc 'select 1' >/dev/null 2>&1; then
                echo "DB_HOST=$host" >> "$GITHUB_ENV"; exit 0
              fi
            done
          done
          echo "::error::Could not connect to the database."; exit 1
      - name: Inventory (read only)
        run: |
          docker run --rm -e PGPASSWORD -v "$PWD/scripts/demo-remove:/sql:ro" postgres:17 \
            psql "host=$DB_HOST port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require" \
            -v ON_ERROR_STOP=1 -c 'begin read only' -f /sql/inventory.sql

  # DRYRUN / DELETE: scripts/demo-remove/cleanup-before-launch.sql in one
  # transaction with the database password. DRYRUN ends with ROLLBACK.
  remove:
    if: ${{ github.event.inputs.confirm == 'DELETE' || github.event.inputs.confirm == 'DRYRUN' }}
    runs-on: ubuntu-latest
    env:
      REF: roeweplhofhjtcnbfmvo
      PROJECT_REF: roeweplhofhjtcnbfmvo
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MODE: ${{ github.event.inputs.confirm }}
      EXTRA_USERS: ${{ github.event.inputs.extra_user_ids }}
      DEMO_PHONES: '970599990001 970599990002 970599990003 970599990004 970599990005'
    steps:
      - uses: actions/checkout@v4

      - name: Find the database address
        run: |
          for region in eu-central-1 eu-central-2 eu-west-1 eu-west-2 eu-west-3 eu-north-1 us-east-1 us-east-2 us-west-1 us-west-2 \
                        ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 ca-central-1 sa-east-1 me-central-1; do
            for n in 0 1; do
              host="aws-$n-$region.pooler.supabase.com"
              if docker run --rm -e PGPASSWORD postgres:17 psql "host=$host port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require connect_timeout=8" -Atc 'select 1' >/dev/null 2>&1; then
                echo "DB_HOST=$host" >> "$GITHUB_ENV"; exit 0
              fi
            done
          done
          echo "::error::Could not connect to the database."; exit 1

      - name: Delete the test data (${{ github.event.inputs.confirm }})
        run: |
          mkdir -p /tmp/sql
          if [ "$MODE" = DELETE ]; then cp scripts/demo-remove/cleanup-before-launch.sql /tmp/sql/run.sql
          else sed 's/^commit;$/rollback;/' scripts/demo-remove/cleanup-before-launch.sql > /tmp/sql/run.sql; fi
          grep -nE '^(commit|rollback);' /tmp/sql/run.sql
          docker run --rm -e PGPASSWORD -v /tmp/sql:/sql:ro postgres:17 \
            psql "host=$DB_HOST port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require" \
            -v ON_ERROR_STOP=1 -v "extra_user_ids=$EXTRA_USERS" -f /sql/run.sql

      # Needs a working SUPABASE_ACCESS_TOKEN secret; if it is expired this step
      # only warns (the demo users are already gone, so the numbers lead nowhere).
      - name: Remove demo numbers from the test phone list
        if: env.MODE == 'DELETE'
        continue-on-error: true
        run: |
          api="https://api.supabase.com/v1/projects/$REF/config/auth"
          curl -fsS --retry 3 --retry-all-errors "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/auth.json
          current=$(jq -r '.sms_test_otp // ""' /tmp/auth.json)
          kept=""
          IFS=',' read -ra entries <<< "$current"
          for e in "${entries[@]}"; do
            num="${e%%=*}"
            case " $DEMO_PHONES " in *" $num "*) ;; *) [ -n "$e" ] && kept="${kept:+$kept,}$e" ;; esac
          done
          jq -n --arg otp "$kept" '{sms_test_otp: $otp}' > /tmp/patch.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --retry 3 --retry-all-errors -X PATCH "$api" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/patch.json)
          echo "HTTP $code"
          case "$code" in 2*) ;; *) head -c 500 /tmp/out.json; exit 1 ;; esac
          echo "Test numbers left: $(echo "$kept" | tr ',' '\n' | grep -c = || true)"

  # SHOWCASE: the platform owner's own demo school and private-tutor page
  # (scripts/demo-remove/admin-showcase.sql), so he can open every area to try
  # and explain the platform. Safe to run again.
  showcase:
    if: ${{ github.event.inputs.confirm == 'SHOWCASE' }}
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: roeweplhofhjtcnbfmvo
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the database address
        run: |
          for region in eu-central-1 eu-central-2 eu-west-1 eu-west-2 eu-west-3 eu-north-1 us-east-1 us-east-2 us-west-1 us-west-2 \
                        ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 ca-central-1 sa-east-1 me-central-1; do
            for n in 0 1; do
              host="aws-$n-$region.pooler.supabase.com"
              if docker run --rm -e PGPASSWORD postgres:17 psql "host=$host port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require connect_timeout=8" -Atc 'select 1' >/dev/null 2>&1; then
                echo "DB_HOST=$host" >> "$GITHUB_ENV"; exit 0
              fi
            done
          done
          echo "::error::Could not connect to the database."; exit 1
      - name: Create the owner's demo organizations
        run: |
          docker run --rm -e PGPASSWORD -v "$PWD/scripts/demo-remove:/sql:ro" postgres:17 \
            psql "host=$DB_HOST port=5432 user=postgres.$PROJECT_REF dbname=postgres sslmode=require" \
            -v ON_ERROR_STOP=1 -f /sql/admin-showcase.sql
